<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74B9FF"/>
      <stop offset="100%" style="stop-color:#0984E3"/>
    </linearGradient>
  </defs>
  <!-- Connection lines -->
  <g stroke="#636E72" stroke-width="2" opacity="0.4">
    <line x1="100" y1="100" x2="40" y2="40"/>
    <line x1="100" y1="100" x2="160" y2="40"/>
    <line x1="100" y1="100" x2="40" y2="160"/>
    <line x1="100" y1="100" x2="160" y2="160"/>
    <line x1="100" y1="100" x2="100" y2="30"/>
    <line x1="100" y1="100" x2="30" y2="100"/>
    <line x1="100" y1="100" x2="170" y2="100"/>
    <line x1="100" y1="100" x2="100" y2="170"/>
  </g>
  <!-- Outer nodes (agents) -->
  <g fill="url(#nodeGrad)">
    <circle cx="40" cy="40" r="12"/>
    <circle cx="160" cy="40" r="12"/>
    <circle cx="40" cy="160" r="12"/>
    <circle cx="160" cy="160" r="12"/>
    <circle cx="100" cy="30" r="12"/>
    <circle cx="30" cy="100" r="12"/>
    <circle cx="170" cy="100" r="12"/>
    <circle cx="100" cy="170" r="12"/>
  </g>
  <!-- Central hub -->
  <circle cx="100" cy="100" r="28" fill="url(#hubGrad)"/>
  <text x="100" y="106" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">SH</text>
</svg>
